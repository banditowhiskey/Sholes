<!DOCTYPE html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8">
    <title>Sholes.js</title>
    <meta name="description" content="Sholes.js typing simulator demo">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        background: #FED18C;
        color: #FEFEFF;
        font-family: Arial, Helvetica, sans-serif;
        font-weight: bold;
        font-size: 2vw;
        margin: 0;
        padding: 0;
      }

      .content {
        display: flex;
        height: 100vh;
        align-content: center;
        align-items: center;
        padding: 0 10vw;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div id="sholes">Words go here. They will be replaced when Sholes.js loads.</div>
    </div>

    <script src="../dist/sholes.min.js"></script>
    <script>
      new Sholes({
        target: 'sholes',
        messages: [
          `Good news, everyone!`,
          `You seem malnourished. Are you suffering from intestinal parasites?`,
          `Well, let's just dump it in the sewer and say we delivered it.`,
          `Bender, we're trying our best.`
        ],
        fSpeed: 15,
        eSpeed: 15,
        delay: 1200,
        remain: 2400,
        variance: 50,
        cursor: true,
      });
    </script>
  </body>
</html>
